schema_version: 1
id: comaps
name: CoMaps
category: offline
license: Apache-2.0
upstream: https://www.comaps.app/
description: Mapas y navegación sin conexión tras descargar regiones; los mapas no se incluyen en el instalador.
capabilities:
  - offline_maps
platforms:
  windows:
    status: verified
    provider: winget
    package_id: CoMaps.CoMaps
    source: https://github.com/microsoft/winget-pkgs/blob/master/manifests/c/CoMaps/CoMaps/2026.06.13-1-0839e6d4/CoMaps.CoMaps.installer.yaml
    verified_at: "2026-11-22"
    scope: unspecified
    provenance: upstream
    provider_dependencies:
      - Microsoft.VCRedist.2015+.x64
    notes: >-
      WinGet manifest CoMaps.CoMaps 2026.06.13-1-0839e6d4 (publisher CoMaps Community,
      nullsoft x64 installer published by the project on cdn-us-1.comaps.app with pinned
      SHA-256, dependency Microsoft.VCRedist.2015+.x64). The manifest declares no Scope:
      Sovereign passes no --scope and warns that Windows may ask for administrator
      approval (maintainer decision 2026-11-22). The Windows build lags the Linux one.
  linux:
    status: verified
    provider: flatpak
    package_id: app.comaps.comaps
    source: https://github.com/flathub/app.comaps.comaps/blob/master/app.comaps.comaps.yml
    verified_at: "2026-11-21"
    scope: user
    provenance: community
    notes: >-
      Flathub stable 2026.11.07, built from the official codeberg.org/comaps/comaps tag
      v2026.11.07-16 (pinned commit) and maintained in github.com/flathub/app.comaps.comaps
      (last update 2026-11-15). Recorded as community because no Flathub verification
      by the CoMaps project could be confirmed. Uses the org.kde.Platform 6.11 runtime
      (large first download) and bundles only the world overview map: regional maps
      are downloaded inside the app.
  android:
    status: pending
    provider: fdroid
    notes: Se requiere revisar repositorio, identificador oficial y firma para el futuro flujo guiado.
