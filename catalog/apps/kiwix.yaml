schema_version: 1
id: kiwix
name: Kiwix
category: reading
license: GPL-3.0
upstream: https://www.kiwix.org/
description: Lector de bibliotecas ZIM (Wikipedia, Wikivoyage y otros contenidos offline).
capabilities:
  - offline_reading
platforms:
  windows:
    status: verified
    provider: winget
    package_id: Kiwix.KiwixJS.Electron
    source: https://github.com/microsoft/winget-pkgs/blob/master/manifests/k/Kiwix/KiwixJS/Electron/3.9.3-E/Kiwix.KiwixJS.Electron.installer.yaml
    verified_at: "2026-11-21"
    scope: user
    provenance: upstream
    notes: >-
      Kiwix JS Electron (WinGet manifest 3.9.3-E, publisher Kiwix, GPL-3.0, released
      2026-09-29). NSIS x86 installer from github.com/kiwix/kiwix-js-pwa releases with
      pinned SHA-256; the manifest offers a user-scope installer (/CURRENTUSER), so no
      administrator prompt. No package dependencies. Kiwix Desktop is not published on
      WinGet; Kiwix JS is Kiwix's own reader and downloads ZIM archives in the app.
  linux:
    status: verified
    provider: flatpak
    package_id: org.kiwix.desktop
    source: https://github.com/flathub/org.kiwix.desktop/blob/master/org.kiwix.desktop.json
    verified_at: "2026-11-22"
    scope: user
    provenance: community
    notes: >-
      Flathub org.kiwix.desktop 2.4.1, maintained in github.com/flathub/org.kiwix.desktop (last
      commit by the Kiwix bot). Recorded as community: Flathub verification by the Kiwix
      project could not be confirmed. Risk accepted by the maintainer on 2026-11-22: no update since
      2024-12 and the org.kde.Platform 5.15-23.08 runtime is end-of-life (no security
      updates). Revisit when Kiwix publishes a newer Flatpak.
