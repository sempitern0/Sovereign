name: Sovereign CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: sovereign-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go format
        shell: bash
        run: |
          gofmt -w cmd internal
          git diff --exit-code -- cmd internal
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/suitectl
      - name: Plan smoke test
        run: go run ./cmd/suitectl plan --profile essential --json
      - name: Bootstrap syntax and smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sh -n bootstrap/setup.sh
            sh bootstrap/setup.sh --json
          else
            pwsh -NoProfile -Command '$tokens = $null; $parseErrors = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) "bootstrap/setup.ps1"), [ref]$tokens, [ref]$parseErrors); if ($parseErrors.Count -gt 0) { throw ($parseErrors -join "; ") }'
            pwsh -NoProfile -File tests/bootstrap_path.ps1
            pwsh -NoProfile -File bootstrap/setup.ps1 -Json
          fi
      - name: H2 fail-closed test
        shell: bash
        run: |
          if go run ./cmd/suitectl apply --app localsend; then
            echo 'Unconsented installation unexpectedly succeeded' >&2
            exit 1
          fi
  catalog:
    name: Catalog contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/validate_catalog.py
      - run: python -m unittest discover -s tests -v
