name: Sovereign CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: sovereign-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go format
        shell: bash
        run: |
          gofmt -w cmd internal embed.go
          git diff --exit-code -- cmd internal embed.go
      - name: Vendor matches go.mod/go.sum
        if: runner.os == 'Linux'
        run: go mod vendor && git diff --exit-code -- vendor go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Wizard interaction tests
        run: go test ./cmd/suitectl -run '^TestWizard' -count=1
      - name: Build
        run: go build ./cmd/suitectl
      - name: Plan smoke test
        run: go run ./cmd/suitectl plan --profile essential --json
      - name: Bootstrap syntax and smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sh -n bootstrap/setup.sh
            sh bootstrap/setup.sh --json
            sh sovereign.sh version --json
          else
            pwsh -NoProfile -Command '$tokens = $null; $parseErrors = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) "bootstrap/setup.ps1"), [ref]$tokens, [ref]$parseErrors); if ($parseErrors.Count -gt 0) { throw ($parseErrors -join "; ") }'
            pwsh -NoProfile -File tests/bootstrap_path.ps1
            pwsh -NoProfile -File bootstrap/setup.ps1 -Json
            pwsh -NoProfile -File sovereign.ps1 version --json
          fi
      - name: H2 fail-closed test
        shell: bash
        run: |
          if go run ./cmd/suitectl apply --app localsend; then
            echo 'Unconsented installation unexpectedly succeeded' >&2
            exit 1
          fi
  catalog:
    name: Catalog contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/validate_catalog.py
      - run: python -m unittest discover -s tests -v
